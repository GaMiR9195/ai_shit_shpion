<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPACE</title>
<link rel="stylesheet" href="style.css">
<!--IMPORTMAP-->
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- KaTeX: the maths in fences and $…$ spans. Loaded the same way as the
     highlighter, and everything that uses it checks for it first, so a
     board with no network still opens and still shows the source. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
<div id="app">
  <canvas id="field"></canvas>
  <div id="grid"></div>
  <div id="world">
    <svg id="ink" xmlns="http://www.w3.org/2000/svg"><defs></defs><g id="inkbody"></g><g id="inkhandles"></g></svg>
    <div id="layer"></div>
  </div>
  <canvas id="scratch"></canvas>
  <div id="cursors"></div>
  <div id="anchor" class="anchor"></div>
  <div id="anchor2" class="anchor"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="mode" class="mode" hidden>Smart draw: on</div>
  <div id="hint" class="hint" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <!-- Swallows every pointer event while a card is being carried or
       resized. Without it a video's own controls or an embedded page ate
       the release and the card stayed glued to the cursor. -->
  <div id="shield"></div>
</div>

<script src="hl.js"></script>
<script src="zip.js"></script>
<script src="icons.js"></script>
<script src="md.js"></script>
<script src="geom.js"></script>
<script src="field.js"></script>
<script src="tidy.js"></script>
<script src="store.js"></script>
<script src="net.js"></script>

<script type="module">
  /* Pretext is required. It is imported, assigned, and used. If it is not
     installed the board does not start and the console says why. */
  import * as Pretext from "@chenglou/pretext";
  window.Pretext = Pretext;
  await import("./app.js");
</script>
</body>
</html>
