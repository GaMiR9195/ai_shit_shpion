<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Локации</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="bar">
  <div class="brand"><i class="dot"></i>локации</div>
  <div class="row">
    <span class="muted small" id="room-badge"></span>
    <button class="ghost" id="btn-sound" title="Звук (S)">♪</button>
    <button class="ghost" id="btn-theme" title="Тема (T)">◐</button>
  </div>
</header>

<main>
  <!-- ВХОД -->
  <section class="screen on" id="screen-auth">
    <div class="card narrow">
      <h1>Кто ты сегодня?</h1>
      <p class="muted">Ник и аватар — больше ничего не нужно.</p>
      <div class="auth-row">
        <img id="avatar-preview" class="avatar xl" alt="аватар" />
        <div class="grow stack">
          <input id="nick" maxlength="14" placeholder="Ник" autocomplete="off" />
          <div class="row wrap">
            <button class="ghost" id="btn-reroll">↻ другой аватар</button>
            <div class="swatches" id="swatches"></div>
          </div>
        </div>
      </div>
      <div class="row gap">
        <button class="primary grow" id="btn-quick">Быстрая игра</button>
        <button id="btn-create">Создать лобби</button>
      </div>
      <div class="row gap">
        <input id="join-code" class="code-input" maxlength="4" placeholder="КОД" />
        <button id="btn-join">Войти по коду</button>
      </div>
      <p class="muted small">Быстрая игра сама найдёт лобби, где уже кто-то ждёт. Нет таких — создаст новое.</p>
    </div>
  </section>

  <!-- ЛОББИ -->
  <section class="screen" id="screen-lobby">
    <div class="card">
      <div class="row between wrap">
        <div>
          <h2 class="tight">Лобби</h2>
          <p class="muted small">Код <button class="code-chip" id="copy-code">····</button> — клик копирует ссылку</p>
        </div>
        <label class="switch"><input type="checkbox" id="public-toggle" /><span>публичное</span></label>
      </div>
      <div class="players" id="lobby-players"></div>
      <div class="divider"></div>
      <div class="row wrap" id="topic-picker"></div>
      <div class="row between wrap">
        <p class="muted small" id="lobby-hint"></p>
        <button class="primary" id="btn-start">Начать раунд</button>
      </div>
    </div>
    <div class="card chat-card">
      <div class="chat" id="chat-lobby"></div>
      <form class="row gap" id="chat-form-lobby">
        <input placeholder="Сообщение" maxlength="160" autocomplete="off" /><button>→</button>
      </form>
    </div>
  </section>

  <!-- ИГРА -->
  <section class="screen" id="screen-game">
    <div class="stack">
      <div class="card location-card" id="location-card"></div>
      <div class="card">
        <div class="row between">
          <span class="muted small">Круг <b id="dir-label"></b></span>
          <span class="timer" id="timer">--:--</span>
        </div>
        <div class="ring" id="ring"></div>
        <div class="row gap wrap">
          <button class="primary" id="btn-next">Ответил → дальше</button>
          <button id="btn-vote">Голосование</button>
          <button class="ghost" id="btn-guess">Угадать локацию</button>
        </div>
      </div>
    </div>
    <div class="card chat-card">
      <div class="chat" id="chat-game"></div>
      <form class="row gap" id="chat-form-game">
        <input placeholder="Сообщение" maxlength="160" autocomplete="off" /><button>→</button>
      </form>
      <div class="row gap reactions" id="reactions"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal"><div class="card modal-body" id="modal-body"></div></div>
<div id="toasts"></div>
<div id="fx"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
